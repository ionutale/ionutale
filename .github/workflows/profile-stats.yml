name: Profile stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for STATS_TOKEN
        id: token
        env:
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "$STATS_TOKEN" ]; then
            echo "STATS_TOKEN is not set — skipping, so public-only numbers never overwrite the real ones."
            echo "Add it once with: gh secret set STATS_TOKEN -R $GITHUB_REPOSITORY"
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute stats
        if: steps.token.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: bash scripts/profile-stats.sh stats.json

      - name: Commit
        if: steps.token.outputs.configured == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.json
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "chore: refresh last-30-days stats"
            git push
          fi
